name: Setup mise toolchain
description: >
  Install mise and the tools from mise.toml a job needs, at the versions
  mise.toml pins. The mise cache is keyed by the tool list, so jobs with
  different lists never restore each other's partial installs.

inputs:
  tools:
    description: >
      Space-separated mise.toml tools to install, e.g. "erlang elixir".
      Empty installs every tool.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v4
      with:
        experimental: true
        cache: true
        install_args: ${{ inputs.tools }}

    - name: Show toolchain
      shell: bash
      run: mise ls
