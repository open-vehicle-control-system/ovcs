name: Setup mise toolchain
description: >
  Install mise and every tool mise.toml pins. Every job installs them all:
  mise.toml's postinstall hook runs `mise run bootstrap`, and `mise run`
  installs any missing tool first. One toolchain, one mise cache entry.

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v4
      with:
        experimental: true
        cache: true

    - name: Show toolchain
      shell: bash
      run: mise ls
