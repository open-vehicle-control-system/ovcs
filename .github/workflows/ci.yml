name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a pull request's runs supersede each other; every push to main
  # runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIX_ENV: test

jobs:
  changes:
    # A pull request runs only the jobs whose inputs it touches; pushes
    # to main and manual runs run every job, which also keeps the caches
    # warm. No job is required by main's branch settings, so a skipped
    # one blocks nothing. The toolchain and this workflow feed every job.
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      elixir: ${{ steps.filter.outputs.elixir }}
      docs: ${{ steps.filter.outputs.docs }}
      cli: ${{ steps.filter.outputs.cli }}
      vue: ${{ steps.filter.outputs.vue }}
      flutter: ${{ steps.filter.outputs.flutter }}
      platformio: ${{ steps.filter.outputs.platformio }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - mise.toml
              - .github/workflows/ci.yml
              - .github/actions/**
            elixir:
              - *shared
              - .credo.exs
              - scripts/check_lock_drift.exs
              - libraries/**
              - vms/core/**
              - vms/api/**
              - vms/firmware/**
              - infotainment/core/**
              - infotainment/api/**
              - infotainment/firmware/**
              - bridges/**
              - vehicles/**
            docs:
              - *shared
              - scripts/check_docs.exs
              - '**/*.md'
            cli:
              - *shared
              - cli/**
            vue:
              - *shared
              - vms/dashboard/**
            flutter:
              - *shared
              - infotainment/dashboard/**
            platformio:
              - *shared
              - controllers/**

  lock-drift:
    # Shared dev tooling must be locked at one version across the 17
    # Mix projects. vms/core silently sat 10 patch versions behind on
    # credo, which only surfaced — as an unrelated-looking
    # Regex.CompileError — once the Elixir version moved.
    name: Elixir · lock drift
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.elixir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mise
        with:
          tools: erlang elixir
      - run: elixir scripts/check_lock_drift.exs

  docs:
    # The guides linked from docs/README.md are rendered as-is on ovcs.be.
    name: Docs · published guides
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mise
        with:
          tools: erlang elixir
      - run: elixir scripts/check_docs.exs

  elixir:
    # Every check on one project, in one job, so its deps, build and PLT
    # are fetched and restored once. Each check is its own step, so a
    # failure still names the tool.
    #
    # `--warnings-as-errors` covers only the project being compiled, not
    # its path deps, which is why every library has its own entry.
    # `--no-start` keeps cantastic (and vms_core / infotainment_core,
    # which need a :vehicle config) from being booted as part of the dep
    # graph. The APIs still boot their Repo explicitly in test_helper.exs
    # so Ecto.Sandbox works; firmware projects have vehicle-specific
    # config guarded on Mix.target() != :host / config_env() != :test.
    name: Elixir · ${{ matrix.project }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.elixir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - libraries/ovcs_can
          - libraries/ovcs_vehicle
          - libraries/ovcs_bus
          - libraries/ovcs_bridge
          - libraries/ovcs_drivers
          - vms/core
          - vms/api
          - vms/firmware
          - infotainment/core
          - infotainment/api
          - infotainment/firmware
          - bridges/firmware
          - bridges/radio_control_bridge
          - bridges/ros_bridge
          - vehicles/ovcs1
          - vehicles/ovcs_mini
          - vehicles/obd2
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mise
        with:
          tools: erlang elixir
      - name: Install system deps for Nerves NIFs
        # Firmware projects and vehicles (transitive firmware deps) both
        # need libmnl-dev for nerves_uevent's NIF.
        if: contains(matrix.project, 'firmware') || startsWith(matrix.project, 'vehicles/')
        run: sudo apt-get update && sudo apt-get install -y libmnl-dev
      - uses: actions/cache@v5
        with:
          path: |
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
          key: elixir-${{ matrix.project }}-${{ hashFiles('mise.toml') }}-${{ hashFiles(format('{0}/mix.lock', matrix.project)) }}
          restore-keys: elixir-${{ matrix.project }}-${{ hashFiles('mise.toml') }}-
      - name: Locate the Erlang and Elixir PLTs
        id: core-plts
        run: echo "dir=$(elixir -e 'IO.puts(Mix.Utils.mix_home())')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.core-plts.outputs.dir }}/dialyxir_*.plt*
          key: dialyzer-core-plts-${{ hashFiles('mise.toml') }}
      - name: Fetch deps
        run: mix deps.get
      - name: Format
        # After deps.get: `.formatter.exs` files with `import_deps:` read them.
        run: mix format --check-formatted
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Credo
        # Credo does not walk up to the shared root config on its own.
        run: mix credo --config-file ${{ github.workspace }}/.credo.exs
      - name: Test
        run: mix test --no-start
      - name: Dialyzer
        run: mix dialyzer --format github

  cli-build:
    name: CLI · cargo build
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mise
        with:
          tools: rust
      - name: Install rustfmt + clippy
        # mise's rust install pulls rustc + cargo via rustup, but not
        # the rustfmt / clippy components.
        run: rustup component add rustfmt clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: cargo-cli-${{ hashFiles('mise.toml') }}-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: cargo-cli-${{ hashFiles('mise.toml') }}-
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo build --release
      - run: cargo test --release
      - name: Ensure release binary exists
        working-directory: ${{ github.workspace }}
        run: test -x cli/target/release/ovcs && file cli/target/release/ovcs | grep -q 'ELF .* executable'

  vue-dashboard:
    name: Vue · vms/dashboard
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.vue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vms/dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mise
        with:
          tools: node
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-vms-dashboard-${{ hashFiles('mise.toml') }}-${{ hashFiles('vms/dashboard/package-lock.json') }}
          restore-keys: npm-vms-dashboard-${{ hashFiles('mise.toml') }}-
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build

  flutter-dashboard:
    name: Flutter · infotainment/dashboard
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infotainment/dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mise
        with:
          tools: flutter
      - uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            infotainment/dashboard/.dart_tool
          key: flutter-${{ hashFiles('mise.toml') }}-${{ hashFiles('infotainment/dashboard/pubspec.lock') }}
          restore-keys: flutter-${{ hashFiles('mise.toml') }}-
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  platformio-controller:
    name: PlatformIO · generic_controller
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.platformio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: controllers/generic_controller
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mise
        with:
          tools: python uv pipx:platformio
      - uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            controllers/generic_controller/.pio
          key: pio-${{ hashFiles('mise.toml') }}-${{ hashFiles('controllers/generic_controller/platformio.ini') }}
          restore-keys: pio-${{ hashFiles('mise.toml') }}-
      - run: pio test -e local_test
      - run: pio run -e uno_r4_minima_prod
