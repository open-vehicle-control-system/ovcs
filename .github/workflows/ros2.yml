name: ROS 2

# Validate configuration, ROS code, runtime images and offline exploration.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'compose/**'
      - 'bridges/ros_bridge/**'
      - 'vehicles/ovcs_mini/**'
      - 'ruff.toml'
      - '.github/workflows/ros2.yml'
  workflow_dispatch:

concurrency:
  group: ros2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    name: compose config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --profile '*' is not a thing, so every profile is named: a
          # service behind a profile is otherwise skipped entirely and
          # never validated. The vehicle file has none.
          - file: compose/compute/docker-compose.yml
            profiles: ''
          - file: compose/local/base.yml
            profiles: --profile standalone --profile calibration --profile nav2
          - file: compose/local/simulation.yml
            profiles: --profile teleop --profile nav2 --profile gui --profile mapping --profile explore
    steps:
      - uses: actions/checkout@v5

      - name: docker compose config
        run: |
          # The local stacks read ZENOH_ENDPOINT_IP from a .env that is
          # deliberately not committed (it holds a site-specific vehicle
          # address), and the vehicle stack gets its configuration from
          # balena device variables. Supply a placeholder so
          # interpolation resolves and a genuinely malformed file is
          # still the only way this fails.
          export ZENOH_ENDPOINT_IP=127.0.0.1
          export FOXGLOVE_BRIDGE_PORT=8765
          docker compose -f '${{ matrix.file }}' ${{ matrix.profiles }} config -q

  pins:
    name: version pins agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: zenoh is one version everywhere
        run: |
          set -eu
          router=$(grep -ho 'eclipse/zenoh:[0-9.]*' compose/compute/docker-compose.yml compose/local/base.yml | sort -u)
          client=$(grep -ho 'eclipse-zenoh==[0-9.]*' compose/compute/images/ros2/Dockerfile | sort -u)
          echo "router image(s): $router"
          echo "python client:   $client"
          [ "$(echo "$router" | wc -l)" -eq 1 ] || { echo "the two compose files pin different router images"; exit 1; }
          [ "${router#eclipse/zenoh:}" = "${client#eclipse-zenoh==}" ] || { echo "router and python client disagree"; exit 1; }

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned: an unpinned linter turns somebody else's release into a
      # red build on an unrelated pull request.
      - name: Install ruff
        run: pipx install ruff==0.16.6

      # Configuration, including which paths are in scope, lives in
      # `ruff.toml` at the repo root so a local run matches this one.
      # `ruff format` is deliberately not checked — see that file.
      - name: ruff check
        run: ruff check --output-format=github .

  exploration-unit:
    name: exploration geometry and action lifetimes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5
      - run: python -m unittest discover -s compose/compute/explore/forward_explore/tests -v

  image:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ros2
            context: compose/compute/images/ros2
            dockerfile: compose/compute/images/ros2/Dockerfile
          - service: nav2
            context: compose/compute
            dockerfile: compose/compute/images/nav2/Dockerfile
          - service: explore
            context: compose/compute
            dockerfile: compose/compute/images/explore/Dockerfile
          - service: rtabmap
            context: compose/compute
            dockerfile: compose/compute/images/rtabmap/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ovcs/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: ROS nodes and real action cancellation
        if: matrix.service == 'nav2'
        run: |
          docker run --rm --network none --entrypoint bash \
            -e RMW_IMPLEMENTATION=rmw_fastrtps_cpp ovcs/nav2:ci -c \
            'source /opt/ros/lyrical/setup.bash && python3 -m unittest discover -s /opt/ovcs/forward_explore/tests -v'
      - name: Closed-loop navigation and sensor-loss checks
        if: matrix.service == 'nav2'
        env:
          NAV2_TEST_IMAGE: ovcs/nav2:ci
          SKIP_BUILD: '1'
        run: compose/local/scripts/verify_exploration.sh
