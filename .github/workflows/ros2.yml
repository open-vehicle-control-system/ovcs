name: ROS 2

# The ROS 2 side had no CI at all. A vehicle's compute stack is deployed
# by balena from `vehicles/<name>/compute/`, so a broken Dockerfile or
# a compose file that does not interpolate only surfaced on deploy —
# the same shape of hole as firmware not being built on pull requests,
# which cost us four rounds of red CI before it was closed.
#
# Four levels, cheapest first:
#
#   * `compose-config` validates every compose file in seconds. It
#     catches the mistakes that are both most likely and most annoying:
#     a typo in a service, a `${VAR:?}` with nothing to satisfy it, an
#     invalid profile, an `extends:` pointing at a service that is not
#     there.
#   * `pins` checks that the zenoh version is the same everywhere it is
#     written. The router image, the Python client in the shared image
#     and the `zenohex` dependency of the Elixir bridge all have to
#     agree; the README says so, and this is what makes it true.
#   * `lint` runs ruff over the repo's own Python. Nothing else does:
#     the launch files, the verification scripts and
#     `decompress_stereo.py` — which runs on the *vehicle* — are only
#     ever parsed when something starts them, so an undefined name in
#     an error path shipped and waited.
#   * `vehicle-image` builds each vehicle's own image on top of the
#     published framework tag — the Dockerfile balena builds on the
#     device.
#   * `image` builds every framework image a compute node runs, for
#     both architectures: amd64 for the workstations that run the same
#     images, arm64 for the compute node itself. Only a build proves the
#     COPY lines that reach across directories, and only an arm64 build
#     proves what the car will actually pull. On `main` the builds are
#     pushed to GHCR by digest and `manifest` stitches the two
#     architectures into one tag per image — the tag a vehicle's
#     compose file names.
#
# Deliberately not built here: the simulator image, which pulls Gazebo
# in through the ROS vendor packages and is far too heavy for per-PR
# CI. If it starts breaking, give it its own scheduled workflow rather
# than putting it in this path.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'compose/**'
      - 'vehicles/*/compute/**'
      - 'ruff.toml'
      - '.github/workflows/ros2.yml'
  workflow_dispatch:

# Where the compute node images are published. A vehicle's compose file
# names `image: ghcr.io/open-vehicle-control-system/ovcs/<name>:latest`
# and balena pulls it, so the vehicle never builds framework images.
env:
  REGISTRY_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ovcs

concurrency:
  group: ros2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    name: compose config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --profile '*' is not a thing, so every profile is named: a
          # service behind a profile is otherwise skipped entirely and
          # never validated. The vehicle file has none.
          - file: vehicles/ovcs_mini/compute/docker-compose.yml
            profiles: ''
          - file: compose/local/base.yml
            profiles: --profile standalone --profile calibration --profile nav2
          - file: compose/local/simulation.yml
            profiles: --profile teleop --profile nav2 --profile gui
    steps:
      - uses: actions/checkout@v5

      - name: docker compose config
        run: |
          # The local stacks read ZENOH_ENDPOINT_IP from a .env that is
          # deliberately not committed (it holds a site-specific vehicle
          # address, and the vehicle whose Nav2 image the stacks build),
          # and the vehicle stack gets its configuration from balena
          # device variables. Supply placeholders so interpolation
          # resolves and a genuinely malformed file is still the only
          # way this fails.
          export ZENOH_ENDPOINT_IP=127.0.0.1
          export FOXGLOVE_BRIDGE_PORT=8765
          export OVCS_VEHICLE=ovcs_mini
          docker compose -f '${{ matrix.file }}' ${{ matrix.profiles }} config -q

  pins:
    name: version pins agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: zenoh is one version everywhere
        run: |
          set -eu
          router=$(grep -ho 'eclipse/zenoh:[0-9.]*' vehicles/*/compute/docker-compose.yml compose/local/base.yml | sort -u)
          client=$(grep -ho 'eclipse-zenoh==[0-9.]*' compose/images/ros2/Dockerfile | sort -u)
          echo "router image(s): $router"
          echo "python client:   $client"
          [ "$(echo "$router" | wc -l)" -eq 1 ] || { echo "the two compose files pin different router images"; exit 1; }
          [ "${router#eclipse/zenoh:}" = "${client#eclipse-zenoh==}" ] || { echo "router and python client disagree"; exit 1; }

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned: an unpinned linter turns somebody else's release into a
      # red build on an unrelated pull request.
      - name: Install ruff
        run: pipx install ruff==0.16.6

      # Configuration, including which paths are in scope, lives in
      # `ruff.toml` at the repo root so a local run matches this one.
      # `ruff format` is deliberately not checked — see that file.
      - name: ruff check
        run: ruff check --output-format=github .

  image:
    name: build ${{ matrix.image }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [ros2, nav2, wifi-firmware, wifi-ap-fix, bridge-nat-fix]
        # Native runners for both architectures rather than QEMU: the
        # ROS apt layers take minutes natively and the better part of
        # an hour emulated. The arm64 runners are free on public repos.
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nav2's Dockerfile COPYs from its sibling ros2/, so its context
      # is compose/images/. Every other image is self-contained in its
      # own directory.
      - name: Build${{ github.event_name != 'pull_request' && ' and push by digest' || '' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image == 'nav2' && 'compose/images' || format('compose/images/{0}', matrix.image) }}
          file: ${{ matrix.image == 'nav2' && 'compose/images/nav2/Dockerfile' || '' }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Pushed by digest only; `manifest` below gives the digests
          # their tags once both architectures exist. On a pull request
          # this is a plain build.
          outputs: type=image,name=${{ env.REGISTRY_IMAGE_PREFIX }}/${{ matrix.image }},name-canonical=true,push-by-digest=true,push=${{ github.event_name != 'pull_request' }}
          # Layer cache in the Actions cache, one scope per image and
          # architecture, so a PR that does not touch a Dockerfile
          # reuses the apt layer rather than re-fetching the ROS
          # package set every run.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: publish ${{ matrix.image }}
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [ros2, nav2, wifi-firmware, wifi-ap-fix, bridge-nat-fix]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags per image: `latest` follows main, and the short commit
      # sha is the immutable name to pin a vehicle to when a framework
      # change must not reach it unreviewed.
      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          image='${{ env.REGISTRY_IMAGE_PREFIX }}/${{ matrix.image }}'
          short=$(echo '${{ github.sha }}' | cut -c1-7)
          set --
          for digest in *; do set -- "$@" "$image@sha256:$digest"; done
          docker buildx imagetools create \
            -t "$image:latest" \
            -t "$image:sha-$short" \
            "$@"
          docker buildx imagetools inspect "$image:latest"

  vehicle-image:
    name: build ${{ matrix.vehicle }}'s images
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        vehicle: [ovcs_mini]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # The vehicle's Dockerfile is FROM the framework's published
      # image. balena pulls it anonymously, which needs the package
      # public; this token reads it either way.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What balena builds on the device: the vehicle's Dockerfile on
      # top of the published framework tag. Built for the compute
      # node's architecture and never pushed — balena does that.
      - name: Build vehicles/${{ matrix.vehicle }}/compute/nav2
        uses: docker/build-push-action@v6
        with:
          context: vehicles/${{ matrix.vehicle }}/compute/nav2
          platforms: linux/arm64
          push: false
