name: ROS 2

# The ROS 2 side had no CI at all. The vehicle stack is built by balena
# from `compose/compute/`, so a broken Dockerfile or a compose file that
# does not interpolate only surfaced on deploy — the same shape of hole
# as firmware not being built on pull requests, which cost us four
# rounds of red CI before it was closed.
#
# Four levels, cheapest first:
#
#   * `compose-config` validates every compose file in seconds. It
#     catches the mistakes that are both most likely and most annoying:
#     a typo in a service, a `${VAR:?}` with nothing to satisfy it, an
#     invalid profile, an `extends:` pointing at a service that is not
#     there.
#   * `pins` checks that both compose files pin the same zenoh router
#     image and that it matches the Python client (`eclipse-zenoh`) in
#     the shared image. The `zenohex` dependency of the Elixir bridge
#     has to agree too, but its zenoh version is not in any file this
#     job can grep: check `bridges/ros_bridge/mix.exs` by hand.
#   * `lint` runs ruff over the repo's own Python. Nothing else does:
#     the launch files and
#     `decompress_stereo.py` — which runs on the *vehicle* — are only
#     ever parsed when something starts them, so an undefined name in
#     an error path shipped and waited.
#   * `image` builds every image the compute node runs, for amd64 (the
#     workstations) and arm64 (the compute node). On `main`, `manifest`
#     publishes each to GHCR as `sha-<short>` and `latest`: the tags
#     `ovcs compute stage` names, so a deploy pulls them instead of
#     rebuilding them.
#
# Deliberately not built here: the simulator image, which pulls Gazebo
# in through the ROS vendor packages and is far too heavy for per-PR
# CI. If it starts breaking, give it its own scheduled workflow rather
# than putting it in this path.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'compose/**'
      - 'vehicles/*/nav2/**'
      - 'vehicles/*/description/**'
      - 'ruff.toml'
      - '.github/workflows/ros2.yml'
  workflow_dispatch:

env:
  REGISTRY_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ovcs

permissions:
  contents: read

concurrency:
  group: ros2-${{ github.ref }}
  # Only a pull request's runs supersede each other; every push to main
  # runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose-config:
    name: compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # --profile '*' is not a thing, so every profile is named: a
          # service behind a profile is otherwise skipped entirely and
          # never validated. The vehicle file has none.
          - file: compose/compute/docker-compose.yml
            profiles: ''
          - file: compose/local/base.yml
            profiles: --profile standalone --profile calibration --profile nav2
          - file: compose/local/simulation.yml
            profiles: --profile teleop --profile nav2 --profile gui
    steps:
      - uses: actions/checkout@v5

      - name: docker compose config
        run: |
          # The local stacks read ZENOH_ENDPOINT_IP from a .env that is
          # deliberately not committed (it holds a site-specific vehicle
          # address), and the vehicle stack gets its configuration from
          # balena device variables. Supply a placeholder so
          # interpolation resolves and a genuinely malformed file is
          # still the only way this fails. The local stacks also need a
          # vehicle to mount; the OVCS Mini reference vehicle is the
          # one with a model and Nav2 parameters.
          export OVCS_VEHICLE=ovcs_mini
          export ZENOH_ENDPOINT_IP=127.0.0.1
          export FOXGLOVE_BRIDGE_PORT=8765
          docker compose -f '${{ matrix.file }}' ${{ matrix.profiles }} config -q

  pins:
    name: version pins agree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: zenoh is one version everywhere
        run: |
          set -eu
          router=$(grep -ho 'eclipse/zenoh:[0-9.]*' compose/compute/docker-compose.yml compose/local/base.yml | sort -u)
          client=$(grep -ho 'eclipse-zenoh==[0-9.]*' compose/compute/images/ros2/Dockerfile | sort -u)
          echo "router image(s): $router"
          echo "python client:   $client"
          [ "$(echo "$router" | wc -l)" -eq 1 ] || { echo "the two compose files pin different router images"; exit 1; }
          [ "${router#eclipse/zenoh:}" = "${client#eclipse-zenoh==}" ] || { echo "router and python client disagree"; exit 1; }

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Pinned: an unpinned linter turns somebody else's release into a
      # red build on an unrelated pull request.
      - name: Install ruff
        run: pipx install ruff==0.16.6

      # Configuration, including which paths are in scope, lives in
      # `ruff.toml` at the repo root so a local run matches this one.
      # `ruff format` is deliberately not checked — see that file.
      - name: ruff check
        run: ruff check --output-format=github .

  image:
    name: build ${{ matrix.image }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [ros2, nav2, ntp, wifi-firmware, wifi-ap-radio, bridge-no-nat]
        # Native runners for both architectures rather than QEMU: the
        # ROS apt layers take minutes natively and the better part of
        # an hour emulated. The arm64 runners are free on public repos.
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Pull requests log in too, to read the layer cache below.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nav2's Dockerfile COPYs from its sibling ros2/ and from the
      # empty vehicle/nav2, so its context is the whole source root.
      # Every other image is self-contained in its own directory.
      - name: Build${{ github.event_name == 'push' && ' and push by digest' || '' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image == 'nav2' && 'compose/compute' || format('compose/compute/images/{0}', matrix.image) }}
          file: ${{ matrix.image == 'nav2' && 'compose/compute/images/nav2/Dockerfile' || '' }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Pushed by digest only; `manifest` below gives the digests
          # their tags once both architectures exist. Off main this is a
          # plain build.
          outputs: type=image,name=${{ env.REGISTRY_IMAGE_PREFIX }}/${{ matrix.image }},name-canonical=true,push-by-digest=true,push=${{ github.event_name == 'push' }}
          # Layer cache in GHCR, beside each image as `buildcache-<arch>`,
          # rather than in the Actions cache, whose 10 GB per repository
          # the ROS layers alone would fill. Only main writes it.
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE_PREFIX }}/${{ matrix.image }}:buildcache-${{ matrix.platform.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}/{1}:buildcache-{2},mode=max,image-manifest=true,oci-mediatypes=true', env.REGISTRY_IMAGE_PREFIX, matrix.image, matrix.platform.arch) || '' }}

      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: publish ${{ matrix.image }}
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [ros2, nav2, ntp, wifi-firmware, wifi-ap-radio, bridge-no-nat]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` follows main; `sha-<short>` is what `ovcs compute
      # stage` pins a release to.
      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          image='${{ env.REGISTRY_IMAGE_PREFIX }}/${{ matrix.image }}'
          short=$(echo '${{ github.sha }}' | cut -c1-7)
          set --
          for digest in *; do set -- "$@" "$image@sha256:$digest"; done
          docker buildx imagetools create \
            -t "$image:latest" \
            -t "$image:sha-$short" \
            "$@"
          docker buildx imagetools inspect "$image:latest"
