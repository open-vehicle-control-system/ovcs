---
# Byte layout unverified: OVMS reads the motor temperature from byte 1 and
# the inverter's from byte 2.
name: inverter_temperatures
id: 0x55A
frequency: 10
signals:
  - name: inverter_communication_board_temperature
    kind: integer
    value_start: 8
    value_length: 8
    unit: "°F"
  - name: insulated_gate_bipolar_transistor_temperature
    kind: integer
    value_start: 16
    value_length: 8
    unit: "°F"
  - name: insulated_gate_bipolar_transistor_board_temperature
    kind: integer
    value_start: 24
    value_length: 8
    unit: "°F"
  - name: motor_temperature
    kind: integer
    value_start: 32
    value_length: 8
    unit: "°F"
