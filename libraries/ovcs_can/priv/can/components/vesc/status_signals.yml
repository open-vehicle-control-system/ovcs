---
# CAN_PACKET_STATUS (packet type 0x09), sent at the VESC's configured
# status rate. `erpm` is signed, so the direction of travel comes with
# the speed rather than being inferred from the command.
#
# `precision` is stated with `scale` because Cantastic otherwise rounds
# the decoded value to two decimals.
- name: erpm
  kind: integer
  value_start: 0
  value_length: 32
  sign: signed
  endianness: big
- name: motor_current
  unit: A
  value_start: 32
  value_length: 16
  sign: signed
  endianness: big
  scale: "0.1"
  precision: 1
- name: duty
  value_start: 48
  value_length: 16
  sign: signed
  endianness: big
  scale: "0.001"
  precision: 3
