---
# CAN_PACKET_SET_DUTY (packet type 0x00): open-loop duty cycle in
# [-1, 1], negative for reverse. Duty control is the voltage-mode
# equivalent of a hand on a trigger, so this is the command a shaped
# hand request drives. Zero duty shorts the motor phases, a drag brake,
# and puts the VESC in its running state; releasing the motor entirely
# is `set_current` at 0.
#
# Emit every 20 ms: the VESC stops the motor when its command timeout
# (1000 ms by default) elapses without a command frame.
- name: duty
  value_start: 0
  value_length: 32
  sign: signed
  endianness: big
  scale: "0.00001"
  precision: 5
