---
# CAN_PACKET_STATUS_5 (packet type 0x1B). The tachometer counts
# electrical steps (six per electrical revolution) since power-up and
# wraps as an int32; `input_voltage` is the battery as the VESC sees
# it. The last two bytes are reserved and not decoded.
- name: tachometer
  kind: integer
  value_start: 0
  value_length: 32
  sign: signed
  endianness: big
- name: input_voltage
  unit: V
  value_start: 32
  value_length: 16
  sign: signed
  endianness: big
  scale: "0.1"
  precision: 1
