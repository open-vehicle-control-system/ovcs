---
# The vehicle's own motion, emitted by the VMS for consumers that
# integrate it — the ROS bridge's odometry publisher first of all.
#
# `speed` is signed: the sign is the direction of travel. It is
# measured when the rotation source knows it (a motor controller
# reporting a signed rpm) and taken from the sign of the throttle
# request otherwise (a hall sensor pulsing once per shaft turn cannot
# know which way the shaft turns). `steering_angle` is the commanded
# angle in radians, positive left per REP-103, derived from the same
# normalised request the steering actuator consumes — commanded, not
# measured; the servo has no feedback.
#
# `speed_valid` is false while the VMS itself does not know the speed
# (the rotation source's frame is dead). An integrator must stop on
# false rather than integrate the last value, for the same reason the
# VMS refuses mode changes on an unknown speed: silence is not
# standstill.
#
# `distance` is the distance the wheels have rolled, signed, in a 16-bit
# millimetre counter that wraps every 65.536 m: an integrator takes the
# difference between two samples, which unlike `speed` carries no
# measuring window's lag. `distance_valid` is false while the VMS has no
# distance source or it is silent.
#
# `sequence` increments once per fresh rotation sample from the source.
# `Cantastic.Emitter` retransmits on a timer, so a frame arriving on
# time only proves the VMS is alive; a sequence that stops advancing
# tells the consumer the *data* went stale even while `speed_valid`
# still reads true.
#
# `precision` is stated with `scale` because Cantastic otherwise rounds
# the decoded value to two decimals.
name: vehicle_motion
id: 0x60B
frequency: 50
signals:
  - name: speed
    unit: m/s
    value_start: 0
    value_length: 16
    sign: signed
    scale: "0.001"
    precision: 3
  - name: steering_angle
    unit: rad
    value_start: 16
    value_length: 16
    sign: signed
    scale: "0.001"
    precision: 3
  - name: speed_valid
    kind: enum
    value_start: 32
    value_length: 1
    mapping:
      0x00: false
      0x01: true
  # Seven bits, so that the emitted frame's signals stay contiguous.
  - name: distance_valid
    kind: enum
    value_start: 33
    value_length: 7
    mapping:
      0x00: false
      0x01: true
  - name: sequence
    kind: integer
    value_start: 40
    value_length: 8
  - name: distance
    unit: m
    value_start: 48
    value_length: 16
    sign: unsigned
    scale: "0.001"
    precision: 3
