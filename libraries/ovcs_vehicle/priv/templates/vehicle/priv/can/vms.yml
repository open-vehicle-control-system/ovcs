---
# VMS-side CAN topology; add a network per hardware bus. Example: vehicles/ovcs1/priv/can/vms.yml.
can_networks:
  ovcs:
    bitrate: 1000000
    emitted_frames:
      - import!:@ovcs_can:can/components/ovcs/0x1A0_vms_status.yml
      - import!:@ovcs_can:can/components/ovcs/0x700_controller_configuration.yml
      - import!:@ovcs_can:can/components/ovcs/0x1AA_vms_command.yml
      - import!:generic_controller/0x702_example_controller_digital_pin_request.yml
    received_frames:
      - import!:@ovcs_can:can/components/ovcs/0x201_infotainment_status.yml
      - import!:generic_controller/0x701_example_controller_alive.yml
      - import!:generic_controller/0x704_example_controller_digital_and_analog_pin_status.yml
