---
# The ROS bridge's CAN topology: the actuator and velocity commands it
# turns ROS 2 messages into.
can_networks:
  ovcs:
    bitrate: 1000000
    emitted_frames:
      - import!:@ovcs_can:can/components/ovcs/0x2B0_ros_actuator_command.yml
      - import!:@ovcs_can:can/components/ovcs/0x2B1_ros_velocity_command.yml
