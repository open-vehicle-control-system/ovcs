# An Xbox controller. The left stick steers; the right stick drives (up)
# or brakes (down) in the gear the triggers hold: RT forward, LT
# backward, neither neutral.
device: "(?i)x-?box.*(pad|controller)"
steering:
  - axis: 0
    gain: -1.0
throttle:
  - axis: 4
gears:
  forward:
    - trigger: 5
  backward:
    - trigger: 2
