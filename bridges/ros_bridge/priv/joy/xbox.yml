# An Xbox controller. The right stick steers, and drives (up) or brakes
# (down) in the gear the triggers hold: RT forward, LT backward,
# neither neutral.
device: "(?i)x-?box.*(pad|controller)"
steering:
  - axis: 3
    gain: -1.0
throttle:
  - axis: 4
gears:
  forward:
    - trigger: 5
  backward:
    - trigger: 2
