# The operator's machine — laptop or workshop box. Everything here is
# interactive or operator-attached: the tooling shell, the game
# controller, the stereo calibrator GUI, and behind profiles the pieces
# a vehicle normally provides (router, Foxglove bridge, Nav2) for
# working with no vehicle on the LAN. Nothing in this file is ever
# pushed to balena; the on-vehicle stack is ../compute/.
#
# Usage (with a vehicle on the LAN):
#   cp .env.example .env      # set ZENOH_ENDPOINT_IP to the compute node
#   docker compose -f base.yml up -d
#   docker compose -f base.yml exec ros2 bash
#
# Usage (no vehicle — everything on this box):
#   ZENOH_ENDPOINT_IP=127.0.0.1 docker compose -f base.yml --profile standalone up -d
#
# Smoke test against the bridge's heartbeat:
#   docker compose -f base.yml exec ros2 bash -lc \
#     'ros2 topic echo /ovcs_heartbeat std_msgs/msg/String'
#
# The Zenoh environment and the shared image come from common.yml via
# `extends:`; the project name keeps this stack's containers apart from
# simulation.yml's, which lives in the same directory.

name: ovcs-base

services:
  zenohd:
    # Only for working without a vehicle. On the car, the router runs
    # on the compute node under balena — starting a second one here and
    # pointing at it is how you end up debugging two fabrics.
    image: eclipse/zenoh:1.9.0
    container_name: ovcs-zenohd
    profiles: ["standalone"]
    restart: unless-stopped
    network_mode: host
    command: ["-l", "tcp/0.0.0.0:7447"]

  ros2:
    # The one service that builds the shared image. The context is the
    # car's own image directory: a workstation runs what the car runs.
    extends:
      file: common.yml
      service: ros2-image
    container_name: ovcs-ros2
    build:
      context: ../compute/images/ros2
      dockerfile: Dockerfile
    volumes:
      # Drop ROS 2 packages you write here; the entrypoint sources
      # /opt/ros/$ROS_DISTRO + this overlay before running the CMD.
      # Nodes that graduate to running on the car get baked into an
      # image under ../compute/images/ instead.
      - ./workspace:/workspace
    # Default image CMD idles. Override via
    # `docker compose -f base.yml run --rm ros2 ros2 topic list` to one-shot.

  nav2:
    # The exact image that runs on the car — same Dockerfile, same
    # baked-in launch and parameters — behind a profile so the loop is
    # testable with no vehicle at all: standalone zenohd + this + a
    # host ros_bridge + a host VMS is the full planner path on one
    # machine. With a vehicle on the LAN, don't start it: the car
    # runs its own and two planners on one fabric would fight over
    # /cmd_vel_nav.
    #
    #   docker compose -f base.yml --profile nav2 up -d
    #
    # Bind mounts work here (unlike balena), so a parameter edit can
    # be tried by mounting ../compute/nav2/config over
    # /opt/ovcs/config before baking it.
    extends:
      file: common.yml
      service: fabric-client
    image: ovcs/nav2:lyrical
    container_name: ovcs-nav2-vehicle
    profiles: ["nav2"]
    build:
      context: ../compute
      dockerfile: images/nav2/Dockerfile

  foxglove_bridge:
    # Also standalone-only: with a vehicle present, Foxglove Studio
    # connects straight to the bridge running on the car
    # (ws://<compute-node-ip>:8765) rather than to a second one here.
    extends:
      file: common.yml
      service: ros2-image
    container_name: ovcs-foxglove-bridge
    profiles: ["standalone"]
    environment:
      FOXGLOVE_BRIDGE_PORT: ${FOXGLOVE_BRIDGE_PORT:-8765}
    command: ["foxglove_bridge"]

  calibrator:
    # One-shot stereo calibration helper. Subscribes to the bridge's
    # /stereo/{left,right}/image_raw/compressed topics, decompresses
    # them to raw, then launches `cameracalibrator` — the standard
    # ROS 2 tool with an OpenCV GUI for coverage histograms +
    # chessboard sampling.
    #
    # On click "Save" the GUI writes /tmp/calibrationdata.tar.gz
    # inside the container; the host-side ./calibration_output
    # bind-mount below makes it appear at
    # compose/local/calibration_output/calibrationdata.tar.gz on the
    # host. Extract → drop left.yaml + right.yaml into
    # vehicles/ovcs_mini/priv/calibration/stereo_{left,right}.yaml.
    #
    # Usage (with the bridge already running and Foxglove showing
    # the live streams): scripts/calibrate.sh
    extends:
      file: common.yml
      service: ros2-image
    container_name: ovcs-calibrator
    # Run on demand only — `docker compose up` skips this.
    profiles: ["calibration"]
    environment:
      # X display from the host. Default to :0 which covers most
      # Linux desktops; override per-host if your DISPLAY is elsewhere.
      DISPLAY: ${DISPLAY:-:0}
      # Tell Qt where to read the X auth cookie from inside the
      # container. Always mounted at /root/.Xauthority below (the
      # host source is parameterized to handle Wayland's XWayland
      # cookie locations).
      XAUTHORITY: /root/.Xauthority
      # Chessboard dimensions used by cameracalibrator. The defaults
      # match the standard 9×7 ROS calibration target (count of
      # *inner* corners), with 25 mm squares — override via env if
      # you printed a different board.
      CHESSBOARD_INNER_CORNERS: ${CHESSBOARD_INNER_CORNERS:-8x6}
      CHESSBOARD_SQUARE_M: ${CHESSBOARD_SQUARE_M:-0.025}
      # Allowed time delta (seconds) between left/right frames the
      # calibrator will pair. Our USB cameras aren't HW-synced; 0.05
      # is a good starting point.
      APPROXIMATE_SYNC: ${APPROXIMATE_SYNC:-0.05}
    volumes:
      # X socket + Xauthority for GUI forwarding. OVCS_XAUTHORITY
      # is set by scripts/calibrate.sh to the real cookie location —
      # under Wayland that's typically /run/user/$UID/.mutter-
      # Xwaylandauth.XXXX, not ~/.Xauthority. Falls back to the
      # legacy ~/.Xauthority for Xorg sessions.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${OVCS_XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro
      # Where the GUI saves calibrationdata.tar.gz.
      - ./calibration_output:/output
    # No restart — this is a one-shot interactive tool.
    restart: "no"
    command: ["calibrator"]

  joy:
    # Reads a USB game controller (Xbox / generic HID) from
    # /dev/input/${JOY_DEV} on this box and republishes it as
    # sensor_msgs/Joy on /joy. `RosBridge.Consumers.Joy` subscribes
    # to the same topic via rmw_zenoh's `0/joy/**` keyexpr, so the
    # joystick drives steering/throttle on the OVCS CAN bus end-to-end
    # — across the fabric, so the controller stays with the operator.
    #
    # Plug the controller in before `docker compose -f base.yml up joy`;
    # the cgroup rule + /dev/input bind-mount let new device nodes show
    # up live (no restart needed if you hot-plug).
    extends:
      file: common.yml
      service: ros2-image
    container_name: ovcs-joy
    environment:
      # joy_linux parameters — override per host if your controller
      # is something other than js0.
      JOY_DEV: ${JOY_DEV:-/dev/input/js0}
      JOY_DEADZONE: ${JOY_DEADZONE:-0.05}
      JOY_AUTOREPEAT_RATE: ${JOY_AUTOREPEAT_RATE:-20.0}
    volumes:
      # Bind-mount the whole /dev/input tree (not a single `devices:`
      # entry) so a hot-plugged controller appears in the container
      # without restarting it. The cgroup rule below grants read/write
      # to any char device with major 13 — the Linux input subsystem.
      - /dev/input:/dev/input
    device_cgroup_rules:
      - 'c 13:* rmw'
    command: ["joy"]
