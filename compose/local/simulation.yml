# Gazebo Jetty simulation of the vehicle named by OVCS_VEHICLE (a
# directory under vehicles/, set in .env). Only ever runs on a
# workstation; nothing in this file is pushed to balena.
#
# It speaks Zenoh like everything else, so a simulated vehicle appears
# on the same fabric as a real one and the existing tooling — `ros2
# topic`, Foxglove — needs no special case. Point it at the local
# `standalone` router in base.yml, or at a vehicle's router to run
# the two side by side.
#
# Usage:
#   docker compose -f base.yml --profile standalone up -d zenohd
#   docker compose -f simulation.yml up -d
#   docker compose -f simulation.yml logs -f gazebo
#
# Nothing here drives the vehicle: the VMS does, through the simulator
# plant in the vehicle's ROS bridge (`OVCS_SIM=1 ./ovcs run <vehicle>`).
# See simulation/README.md.
#
# The Zenoh environment comes from common.yml via `extends:`; the
# project name keeps this stack's containers apart from base.yml's,
# which lives in the same directory.

name: ovcs-simulation

services:
  gazebo:
    extends:
      file: common.yml
      service: fabric-client
    build:
      # The context is compose/, not this directory, so the image can
      # COPY the Zenoh session template and entrypoint from the car's
      # image (../compute/images/ros2) instead of keeping a second copy.
      context: ..
      dockerfile: local/images/gazebo/Dockerfile
    image: ovcs/gazebo:jetty
    container_name: ovcs-gazebo
    environment:
      # Gazebo finds meshes and models through this. Only the world
      # directory for now — the model is spawned from
      # /robot_description, not from the resource path.
      GZ_SIM_RESOURCE_PATH: /opt/ovcs/worlds
      # Every Gazebo process runs on this host, and the host network
      # has several interfaces. Unpinned, gz-transport discovery picks
      # among them and some subscriptions never connect: a bridged
      # topic then stays silent for the whole run.
      GZ_IP: 127.0.0.1
    volumes:
      # The vehicle's model and simulation.yaml, mounted under its own
      # name.
      - ../../vehicles/${OVCS_VEHICLE:?set OVCS_VEHICLE in compose/local/.env}/description:/opt/ovcs/vehicles/${OVCS_VEHICLE}:ro
      # Macros shared by every model. The xacros reach it as
      # ../../common relative to themselves, which resolves inside the
      # container regardless of where the files sit in the repo.
      - ./simulation/common:/opt/ovcs/common:ro
      # Iterate on the launch file and world without rebuilding too.
      # The image carries its own copies, so the stack still runs if
      # this mount is dropped.
      - ./simulation/launch:/opt/ovcs/launch:ro
      - ./simulation/worlds:/opt/ovcs/worlds:ro
      # The GPU, for the cameras. Without it Mesa renders them on the
      # CPU (llvmpipe), which takes most of a workstation's cores.
      # Bind-mounted rather than a `devices:` entry, which fails `up` on
      # a machine without one; the cgroup rule grants the DRM devices.
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      - 'c 226:* rmw'
    command:
      - bash
      - -lc
      - "ros2 launch /opt/ovcs/launch/sim.launch.py vehicle:=${OVCS_VEHICLE}"

  nav2:
    # Nav2, behind a profile so the plain `up -d` above stays a bare
    # simulator. The image is the car's own (../compute/images/nav2):
    # same Dockerfile, same tag as base.yml's `nav2`, so a simulated
    # run exercises the configuration that ships. The one difference
    # is the clock, and it is a visible launch argument.
    #
    #   docker compose -f simulation.yml --profile nav2 up -d nav2
    #
    # It drives through /cmd_vel_nav, which the ROS bridge carries to
    # the VMS, as on the vehicle.
    extends:
      file: common.yml
      service: fabric-client
    build:
      context: ../compute
      dockerfile: images/nav2/Dockerfile
    image: ovcs/nav2:lyrical
    container_name: ovcs-nav2
    profiles: ["nav2"]
    # The launch file is mounted over the image's so an edit is tried
    # without a rebuild; the parameters are the vehicle's.
    volumes:
      - ../compute/images/nav2/launch:/opt/ovcs/launch:ro
      - ../../vehicles/${OVCS_VEHICLE}/nav2:/opt/ovcs/config:ro
    command:
      - bash
      - -lc
      - "ros2 launch /opt/ovcs/launch/nav2.launch.py use_sim_time:=true"

  gazebo-gui:
    # Gazebo's GUI, as a separate service so the headless simulation
    # above never depends on a display existing. Needs an X socket:
    #   xhost +local:docker
    #   docker compose -f simulation.yml --profile gui up -d gazebo-gui
    #
    # A fabric client only because the shared entrypoint insists on
    # ZENOH_ENDPOINT_IP; the GUI itself talks to the simulator over
    # Gazebo's own transport.
    extends:
      file: common.yml
      service: fabric-client
    image: ovcs/gazebo:jetty
    container_name: ovcs-gazebo-gui
    profiles: ["gui"]
    restart: "no"
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: 1
      # As for `gazebo`, which it must share an interface with.
      GZ_IP: 127.0.0.1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # The GPU, as for `gazebo`.
      - /dev/dri:/dev/dri
      # The GUI loads its own copies of the model's meshes, from the
      # path the server spawned it with.
      - ../../vehicles/${OVCS_VEHICLE}/description:/opt/ovcs/vehicles/${OVCS_VEHICLE}:ro
    device_cgroup_rules:
      - 'c 226:* rmw'
    command:
      - bash
      - -lc
      - "gz sim -g"
