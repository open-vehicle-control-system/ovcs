# OVCS Mini mapping/navigation parameters, shared with offline simulation.
# Planning and commanded twists use the Ackermann rear axle reference.
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    controller_plugins: ["FollowPath", "Retreat"]
    progress_checker_plugins: ["progress_checker", "retreat_progress_checker"]
    goal_checker_plugins: ["goal_checker", "retreat_goal_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 8.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.20
      stateful: false
    retreat_progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.03
      movement_time_allowance: 3.0
    retreat_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.20
      stateful: false
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.20
      lookahead_dist: 0.35
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.45
      use_velocity_scaled_lookahead_dist: false
      allow_reversing: false
      use_rotate_to_heading: false
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.70
      regulated_linear_scaling_min_speed: 0.10
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.30
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      # Above the 0.08 m/s drivetrain deadband during goal approaches.
      min_approach_linear_velocity: 0.10
      approach_velocity_scaling_dist: 0.35
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.2

    # Explicit FollowPath recovery over the recently driven route.
    Retreat:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.10
      lookahead_dist: 0.12
      min_lookahead_dist: 0.10
      max_lookahead_dist: 0.15
      use_velocity_scaled_lookahead_dist: false
      allow_reversing: true
      use_rotate_to_heading: false
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      min_approach_linear_velocity: 0.10
      approach_velocity_scaling_dist: 0.15
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.2

    # Loaded only by the explicit offline controller comparison.
    MPPI:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "AckermannConstraints"
      AckermannConstraints:
        plugin: "mppi::AckermannMotionModel"
        min_turning_r: 0.7

      time_steps: 40
      model_dt: 0.05
      batch_size: 1000
      vx_std: 0.2
      wz_std: 0.2
      vx_max: 0.25
      vx_min: 0.0
      wz_max: 2.5
      ax_max: 1.0
      ax_min: -2.0
      az_max: 3.0
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      prune_distance: 2.0
      transform_tolerance: 0.2
      regenerate_noises: true

      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"

      ConstraintCritic: {enabled: true, cost_power: 1, cost_weight: 4.0}
      GoalCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 0.6}
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.6
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: rear_axle
      initial_transform_timeout: 300.0
      update_frequency: 10.0
      publish_frequency: 5.0
      always_send_full_costmap: true
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.462, 0.19], [0.462, -0.19], [-0.138, -0.19], [-0.138, 0.19]]"
      plugins: ["stvl_layer", "inflation_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 15.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        observation_sources: stereo_marking stereo_clearing
        stereo_marking:
          topic: /stereo/points
          data_type: PointCloud2
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.05
          max_obstacle_height: 0.6
          expected_update_rate: 0.5
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "passthrough"
          clear_after_reading: true
        stereo_clearing:
          topic: /stereo/points
          data_type: PointCloud2
          marking: false
          clearing: true
          min_z: 0.55
          max_z: 3.0
          vertical_fov_angle: 0.43
          horizontal_fov_angle: 0.45
          decay_acceleration: 5.0
          model_type: 0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: rear_axle
      initial_transform_timeout: 300.0
      update_frequency: 2.0
      publish_frequency: 1.0
      always_send_full_costmap: true
      rolling_window: false
      track_unknown_space: true
      resolution: 0.05
      footprint: "[[0.462, 0.19], [0.462, -0.19], [-0.138, -0.19], [-0.138, 0.19]]"
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /rtabmap/map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        trinary_costmap: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.10
      downsample_costmap: false
      allow_unknown: false
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      minimum_turning_radius: 0.70
      reverse_penalty: 3.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.5
      max_iterations: 250000
      max_planning_time: 1.0
      lookup_table_size: 5.0
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: rear_axle
    odom_topic: /odom
    transform_tolerance: 0.2
    default_nav_to_pose_bt_xml: /opt/ovcs/config/nav2_ackermann_bt.xml
    default_nav_through_poses_bt_xml: /opt/ovcs/config/nav2_ackermann_through_poses_bt.xml

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 0.417]
    min_velocity: [-0.12, 0.0, -0.417]
    max_accel: [0.4, 0.0, 0.67]
    max_decel: [-0.6, 0.0, -1.0]
    deadband_velocity: [0.08, 0.0, 0.0]
    velocity_timeout: 0.25

motion_guard:
  ros__parameters:
    front: 0.462
    rear: 0.138
    half_width: 0.19
    max_speed: 0.25
    reverse_speed: 0.12
    min_turning_radius: 0.6
    reverse_budget: 1.0
    perimeter: 4.0
    max_duration: 600.0
    map_timeout: 3.0
    # Conservative model inputs; validate stopping distance on the physical vehicle.
    stopping_deceleration: 0.3
    reaction_time: 0.6

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 4.0
    node_names:
      - controller_server
      - planner_server
      - velocity_smoother
      - bt_navigator
