# Everything that runs on the vehicle's compute node, deployed to
# balenaOS. This directory is the balena *source root*: `balena push`
# is run from here, and balena requires every `build:` context to sit
# inside it — which is why the images live under ./images and the
# never-deployed stacks (operator laptop, simulator) live next door in
# ../local and reach across to build the same images.
#
# Usage:
#   balena push ovcs-mini-ros          # build on balena's builders + OTA
#   balena push <device>.local         # local mode, no cloud round-trip
#
# Plain `docker compose up -d` also works here for a bare-metal
# rehearsal on any aarch64 box.
#
# Deliberate omissions vs ../local/*.yml — the balena supervisor
# implements a subset of Compose v2 (its parser is based on 2.4), so
# this file avoids:
#   * YAML anchors, `extends:` and `${VAR:-default}` interpolation —
#     every value is literal; runtime overrides come from balena
#     fleet/device variables, not a .env file. The Zenoh environment
#     the local stacks share through ../local/common.yml is spelled
#     out per service here.
#   * `container_name` — the supervisor names containers itself.
#   * `profiles:` and `device_cgroup_rules` — unsupported.
#   * host bind mounts — not available on balenaOS. Anything a
#     service needs at runtime is baked into the image (see
#     images/*/Dockerfile) or lives in a named volume.
#   * the "one service builds, the rest reference the tag" pattern —
#     balena builds and tags per service, so each custom-image
#     service carries its own `build:`. The layer cache makes the
#     second and later builds cheap.
# `version` is obsolete for modern `docker compose` (which warns and
# ignores it) but is what balena's v2-based parser expects to see. 2.1
# is a safe floor — balena's own support tables are written against
# 2.4.
version: '2.1'

services:
  wifi_firmware:
    # Stages the AX210 blobs into balenaOS's `extra-firmware` volume,
    # which is already the host kernel's firmware_class.path —
    # without them the PCIe Wi-Fi card never binds a driver. See
    # ./images/wifi-firmware/Dockerfile for why this is a service and
    # not a file on the host, and ./host/README.md for the network built
    # on top of it.
    #
    # The volume outlives a reboot, so this only has to beat iwlwifi to
    # it once; it stays in the release because an OS update can prune a
    # volume no release declares.
    build: ./images/wifi-firmware
    labels:
      io.balena.features.extra-firmware: '1'
    # No `restart:` override on purpose. `restart: 'no'` looks right
    # for a one-shot but sends the supervisor into a permanent loop:
    # it applies the policy to the engine, then reads the container
    # back, diffs it against target state as
    # `{"updated":{"restart":""}}`, and replaces the container —
    # forever, about once a second. So this stays on the supervisor's
    # `always` default and the container simply never exits (see
    # ./images/wifi-firmware/Dockerfile).

  wifi_ap_fix:
    # Correct the host supplicant's channel-149 / 80 MHz center frequency
    # and restore the tested transmit-power limit after driver resets.
    # It edits the network inside the host's wpa_supplicant over D-Bus,
    # behind NetworkManager's back: NetworkManager rewrites that network
    # every time it (re)activates the profile, which is why the service
    # loops every two seconds rather than acting once. If the access
    # point ever behaves oddly, this tug-of-war is the first suspect —
    # `balena logs wifi_ap_fix` shows each correction it makes.
    build: ./images/wifi-ap-fix
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
    labels:
      io.balena.features.dbus: '1'
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host/run/dbus/system_bus_socket

  bridge_nat_fix:
    # Keeps the host's NAT off frames the ovcs0 bridge forwards between
    # eth0 and the access point — without it mDNS between a laptop on
    # the access point and the wired boards is silently broken. See
    # ./images/bridge-nat-fix/Dockerfile for the mechanism. Privileged
    # host networking because it edits the host's nat table; it loops
    # so the rule outlives NetworkManager re-activating the bridge.
    build: ./images/bridge-nat-fix
    restart: always
    network_mode: host
    privileged: true

  zenohd:
    # The vehicle *is* the router for the OVCS fabric, so the fabric
    # survives the base station disconnecting. Everything else —
    # the Nerves bridges (tcp/<this-host-ip>:7447, baked in at firmware
    # build time), the services below, and the base station — joins
    # as a client.
    image: eclipse/zenoh:1.9.0
    restart: always
    # Host networking so the router's listen socket and Zenoh's local
    # discovery behave the same as a bare-metal install.
    network_mode: host
    command: ["-l", "tcp/0.0.0.0:7447"]

  foxglove_bridge:
    # ROS 2 → WebSocket bridge. Foxglove Studio on the base station
    # connects to ws://<compute-node-ip>:8765 and sees everything on the
    # fabric, including the Elixir bridge's topics.
    build: ./images/ros2
    restart: always
    network_mode: host
    depends_on:
      - zenohd
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_SESSION_CONFIG_URI: /tmp/zenoh-session.json5
      # The router is this same host. The entrypoint requires this to
      # be set (`:?`), so it is literal rather than defaulted.
      ZENOH_ENDPOINT_IP: "127.0.0.1"
      # FOXGLOVE_BRIDGE_PORT is deliberately absent: the launcher
      # defaults it to 8765, so a balena fleet/device variable is the
      # only other source and we never have to reason about whether
      # such a variable overrides a literal compose `environment:`.
    command: ["foxglove_bridge"]

  nav2:
    # The planner, onboard, so autonomy survives the base station
    # leaving — the same reason the router lives here. No profiles on
    # balena, so it always runs; with no goal the controller commands
    # nothing, and the VMS's control level arbitration gates whatever
    # it commands in any case. Launch file and parameters are baked
    # into the image from ./nav2 — the same files the simulator
    # mounts. Context is the source root so the Dockerfile can reuse
    # ./images/ros2's entrypoint and Zenoh template.
    build:
      context: .
      dockerfile: images/nav2/Dockerfile
    restart: always
    network_mode: host
    depends_on:
      - zenohd
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_SESSION_CONFIG_URI: /tmp/zenoh-session.json5
      ZENOH_ENDPOINT_IP: "127.0.0.1"

  # Further onboard services — autonomy, perception, telemetry, ROS or
  # not — go here as additional services, each with its own `build:`
  # pointing at its own directory under ./images. There is no
  # bind-mounted ./workspace on the vehicle — a node that runs on the
  # car ships inside an image, which is the whole point of putting this
  # on an immutable OS. Iterate against ../local/base.yml first, then
  # bake.
