[tools]
# OTP 28 to match every Nerves target: the base systems and the bridges
# Pi 5 system all ship the OTP 28 line (nerves_system_br 1.33.7). Mix
# refuses to cross-compile across major OTP versions, so the host pin has
# to track the targets. See docs/toolchain_and_otp.md.
erlang  = "28.4.1"
elixir  = "1.19.5-otp-28"
node    = "24"
ruby    = "3.3"
rust    = "1.90"
flutter = "3.32.8"
python  = "3.12"
uv      = "latest"
"pipx:platformio" = "latest"
# balena CLI, for deploying the ROS compute node's containers
# (ros2/vehicule/ → balenaOS). Pinned to the major: the CLI talks to a
# hosted API, so patches are fine but a major bump is a decision. The
# standalone build bundles its own Node, so it is independent of the
# `node` pin above. See docs/ros_compute_node.md.
balena  = "25"

[env]
# Work around a ruby-build 20260412 bug on Ubuntu 26.04 where the Rekor
# attestation public key cannot be parsed. Safe to disable — we still verify
# the download SHA.
RUBY_BUILD_ATTESTATION_VERIFY = "false"

# Example runtime env; uncomment and adjust as needed.
# VEHICLE = "Ovcs1"
# CAN_NETWORK_MAPPINGS = "ovcs:can0,leaf_drive:vcan1,polo_drive:vcan2,orion_bms:vcan3,misc:vcan4"

[settings]
# Required to opt into the [hooks] block below.
experimental = true

[hooks]
# Runs automatically after `mise install`, so the Mix archive setup stays in
# lockstep with whichever Elixir version mise has just put in place.
postinstall = "mise run bootstrap && mise run libraries"

[tasks.bootstrap]
description = "One-time Elixir + Nerves setup (hex, rebar, nerves_bootstrap archive)"
run = """
mix local.hex --force
mix local.rebar --force
mix archive.install hex nerves_bootstrap --force
"""

# External libraries live in their own repos and are sideloaded into
# `libraries/` (see libraries/.gitignore). This task clones any that
# are missing; existing clones are left alone so you can pull/edit
# them without the task stomping.
[tasks.libraries]
description = "Clone external libraries (cantastic, express_lrs, msp_osd, ovcs_control) into libraries/"
run = """
set -e
for lib in cantastic express_lrs msp_osd ovcs_control; do
  if [ ! -d "libraries/$lib/.git" ]; then
    echo "→ cloning $lib"
    git clone "https://github.com/open-vehicle-control-system/$lib.git" "libraries/$lib"
  else
    echo "✓ $lib already cloned"
  fi
done
"""

[tasks.verify-perception]
description = "Boot the simulator + perception pipeline and check depth geometry against the world"
run = "cd ros2/simulation && ./verify_perception.sh"

[tasks.fetch-models]
description = "Download + verify the detection models (not vendored — see scripts/models.tsv for why)"
run = "./scripts/fetch_models.sh"

[tasks.cli]
description = "Build the ovcs CLI (Rust release binary → cli/ovcs)"
run = "cd cli && cargo build --release && strip --strip-all target/release/ovcs && cp target/release/ovcs ovcs && chmod +x ovcs"

# The infotainment dashboard (Flutter) is run on its own — not as an `./ovcs
# run` dev add-on — so it keeps a real stdin/TTY and full interactive hot
# reload (`r` / `R`). Start `./ovcs run <vehicle>` in another terminal for
# the BEAMs; the app talks to the infotainment API on :4001. Needs the Linux
# desktop toolchain (see docs/getting_started.md).
[tasks.infotainment-dashboard]
description = "Run the infotainment Flutter dashboard locally (native window, hot reload)"
run = "cd infotainment/dashboard && flutter run -d linux"
