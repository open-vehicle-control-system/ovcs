# OVCS Mini uses rear-axle Ackermann kinematics and rolling odom-frame costmaps.
# The simulator overlays use_sim_time; calibration and validation are in README.md.

controller_server:
  ros__parameters:
    use_sim_time: false
    # The rate the local costmap refreshes at: each cycle waits for a
    # fresh costmap, so a faster controller only misses its rate.
    controller_frequency: 10.0
    # The CAN command path runs at 100 Hz (`frequency: 10` in Cantastic
    # is a period in milliseconds), so 10 Hz here is not the bottleneck.
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    # The default path handler. A Reeds-Shepp plan has cusps; without
    # inversion MPPI sees the whole path at once and cuts across them.
    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"
      enforce_path_inversion: true
      prune_distance: 2.0

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      # Facing an obstacle close ahead, MPPI can hold the car for about
      # 5 s while the costmaps fill in and it finds a way around.
      movement_time_allowance: 15.0

    goal_checker:
      # `yaw_goal_tolerance` is deliberately huge. A car cannot rotate on
      # the spot, so any final-heading requirement it cannot satisfy by
      # driving leaves it stuck at the goal until the action times out.
      # Position is what matters here; heading is whatever the approach
      # produced.
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.15
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # `motion_model` names a plugin *instance*, and the class comes
      # from `<instance>.plugin` — the same name-then-plugin pattern as
      # the critics. Putting the class directly in `motion_model` fails
      # with "No 'plugin' param for param ns!", which is a confusing way
      # to be told you named a class where a namespace was wanted.
      #
      # The instance is called AckermannConstraints so `min_turning_r`
      # keeps the parameter path it had when this was not a plugin.
      motion_model: "AckermannConstraints"
      AckermannConstraints:
        plugin: "mppi::AckermannMotionModel"
        min_turning_r: 0.6

      # model_dt is the controller's period; 20 steps keep a 2 s horizon.
      time_steps: 20
      model_dt: 0.1
      batch_size: 1000
      # Enable trajectory markers only during tuning.
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 50
        time_step: 4
      vx_std: 0.2
      # Wide enough to sample the yaw rate a planned arc needs at speed;
      # wider shows up as wobble in the chosen command.
      wz_std: 0.4
      vx_max: 0.8
      # Behind the car only the lidar and the rear ultrasonics see, so
      # reverse stays slow; PreferForwardCritic keeps it a last resort.
      vx_min: -0.3
      wz_max: 2.5
      # From standstill MPPI reaches two steps of ax_max * model_dt, so
      # this also sets how quickly a start clears the smoother's deadband.
      ax_max: 1.0
      ax_min: -2.0
      az_max: 3.0
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      regenerate_noises: true

      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
        - "VelocityDeadbandCritic"

      # The VMS drives any slower non-zero speed at its 0.15 m/s minimum
      # (`@min_speed_m_s`, above the VESC's Minimum ERPM), so a trajectory
      # planned through that band is not the one driven.
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0
        deadband_velocities: [0.15, 0.0, 0.0]
      ConstraintCritic: {enabled: true, cost_power: 1, cost_weight: 4.0}
      # Near enough that a short path is followed, not chased as a point.
      GoalCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 0.6}
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        use_path_orientations: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.6
      PathAngleCritic:
        enabled: true
        mode: 2
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_rear_axle
      # Allow the VMS and odometry publisher to finish booting.
      initial_transform_timeout: 300.0
      transform_tolerance: 0.2
      update_frequency: 10.0
      publish_frequency: 5.0
      # Foxglove draws the full grid only, not costmap_updates.
      always_send_full_costmap: true
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Body envelope expressed at the rear axle, including clearance.
      footprint: "[[0.462, 0.19], [0.462, -0.19], [-0.138, -0.19], [-0.138, 0.19]]"
      plugins: ["stvl_layer", "denoise_layer", "lidar_layer", "range_left_layer", "range_right_layer", "inflation_layer"]
      stvl_layer:
        # The camera looks forward only, so a mark that leaves its view
        # is never seen again; voxels expire instead of persisting.
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 15.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        # Occupied vertical voxels required in a projected column.
        mark_threshold: 2
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        observation_sources: stereo_marking stereo_clearing
        stereo_marking:
          topic: /stereo/points
          data_type: PointCloud2
          marking: true
          clearing: false
          obstacle_range: 3.0
          # Above the glossy floor's reflections, which read 7-10 cm high.
          min_obstacle_height: 0.12
          max_obstacle_height: 0.6
          expected_update_rate: 0.5
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "passthrough"
          clear_after_reading: true
        stereo_clearing:
          # The frustum of stereo_left_optical (z forward).
          # Symmetric, so as wide as the narrower side of the matched
          # band: the leftmost num_disparities columns see nothing.
          # It starts at the stereo's near limit, f * B / num_disparities,
          # so an obstacle too close to be measured is not cleared.
          topic: /stereo/points
          expected_update_rate: 0.5
          data_type: PointCloud2
          marking: false
          clearing: true
          min_z: 0.55
          max_z: 3.0
          vertical_fov_angle: 0.43
          horizontal_fov_angle: 0.45
          decay_acceleration: 5.0
          model_type: 0
      denoise_layer:
        # Tune the minimum physical cluster area at this grid resolution.
        plugin: "nav2_costmap_2d::DenoiseLayer"
        minimal_group_size: 5
        group_connectivity_type: 8
      lidar_layer:
        # The RPLIDAR's 360° scan, after denoise_layer: its returns are not
        # stereo mismatches, and a chair leg is a single cell.
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          expected_update_rate: 0.3
          data_type: "LaserScan"
          marking: true
          clearing: true
          # +Inf, no return, clears up to raytrace_max_range.
          inf_is_valid: true
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
          max_obstacle_height: 0.6
      range_left_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        topics: ["/ultrasound/rear_left"]
        no_readings_timeout: 0.5
        clear_on_max_reading: true
      range_right_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        topics: ["/ultrasound/rear_right"]
        no_readings_timeout: 0.5
        clear_on_max_reading: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Steep enough that a gap a little wider than the car is cheap at
        # its centre; MPPI's CostCritic and Smac both steer by these costs.
        cost_scaling_factor: 10.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_rear_axle
      initial_transform_timeout: 300.0
      transform_tolerance: 0.2
      update_frequency: 2.0
      publish_frequency: 1.0
      # Foxglove draws the full grid only, not costmap_updates.
      always_send_full_costmap: true
      # Rolling, because without a map there is no fixed extent to
      # anchor a static costmap to.
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.1
      footprint: "[[0.462, 0.19], [0.462, -0.19], [-0.138, -0.19], [-0.138, 0.19]]"
      plugins: ["obstacle_layer", "denoise_layer", "lidar_layer", "range_left_layer", "range_right_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        # One cloud, two sources. Heights are in odom, whose z is the
        # ground: marking ignores the floor, but clearing needs it, since
        # in a clear path nearly every ray ends on the floor and would
        # otherwise never erase a false match.
        observation_sources: stereo_marking stereo_clearing
        stereo_marking:
          topic: /stereo/points
          expected_update_rate: 0.5
          data_type: "PointCloud2"
          marking: true
          clearing: false
          # Above the glossy floor's reflections, which read 7-10 cm high.
          min_obstacle_height: 0.12
          max_obstacle_height: 0.6
          obstacle_max_range: 3.0
        stereo_clearing:
          topic: /stereo/points
          expected_update_rate: 0.5
          data_type: "PointCloud2"
          marking: false
          clearing: true
          min_obstacle_height: -0.5
          max_obstacle_height: 0.6
          raytrace_max_range: 3.5
      denoise_layer:
        # Tune the minimum physical cluster area at this grid resolution.
        plugin: "nav2_costmap_2d::DenoiseLayer"
        minimal_group_size: 2
        group_connectivity_type: 8
      lidar_layer:
        # The RPLIDAR's 360° scan, after denoise_layer: its returns are not
        # stereo mismatches, and a chair leg is a single cell.
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          expected_update_rate: 0.3
          data_type: "LaserScan"
          marking: true
          clearing: true
          # +Inf, no return, clears up to raytrace_max_range.
          inf_is_valid: true
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
          max_obstacle_height: 0.6
      range_left_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        topics: ["/ultrasound/rear_left"]
        no_readings_timeout: 0.5
        clear_on_max_reading: true
      range_right_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        topics: ["/ultrasound/rear_right"]
        no_readings_timeout: 0.5
        clear_on_max_reading: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Steep enough that a gap a little wider than the car is cheap at
        # its centre; MPPI's CostCritic and Smac both steer by these costs.
        cost_scaling_factor: 10.0
        inflation_radius: 0.55

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      motion_model_for_search: "REEDS_SHEPP"
      # Wider than MPPI's min_turning_r, so the controller has steering
      # left to catch up on a curve rather than falling outside it.
      minimum_turning_radius: 0.8
      # Behind the car only the lidar and the rear ultrasonics see.
      reverse_penalty: 5.0
      # The direct Reeds-Shepp shot to the goal skips reverse_penalty, so
      # it is kept short.
      analytic_expansion_max_length: 1.0
      # The goal checker ignores heading, so the plan may arrive facing
      # whichever way is shortest.
      goal_heading_mode: "ALL_DIRECTION"
      tolerance: 0.25
      allow_unknown: true
      # Well inside the behaviour tree's one-second replanning period.
      max_planning_time: 0.5
      # The global costmap rolls with the car.
      cache_obstacle_heuristic: false
      # Built at configure, which must finish inside rmw_zenoh's 10 s
      # service timeout; the default 20 m does not.
      lookup_table_size: 6.0
      smooth_path: true

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_rear_axle
    odom_topic: /odom
    transform_tolerance: 0.2
    # How long a tree node waits for a server to accept its request. The
    # default 20 ms is missed over Zenoh while the planner is searching,
    # and a missed acknowledgment fails the whole goal.
    default_server_timeout: 1000
    # Both trees are overridden, because both stock trees put Spin in
    # their recovery branch and this vehicle cannot execute one: the
    # behaviour runs its full duration, produces no motion, and burns a
    # RecoveryNode retry, so a single transient planning failure is
    # enough to abort the action.
    default_nav_to_pose_bt_xml: /opt/ovcs/config/nav2_ackermann_bt.xml
    default_nav_through_poses_bt_xml: /opt/ovcs/config/nav2_ackermann_through_poses_bt.xml
    # The actions in those trees whose error codes the navigators report.
    error_code_name_prefixes: ["compute_path", "follow_path", "backup", "wait"]

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_rear_axle
    transform_tolerance: 0.2
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    # `minimum_speed` floors the ramp down at the end of a drive, which
    # would otherwise slow below the VESC's Minimum ERPM and stall short
    # of the distance.
    backup:
      plugin: "nav2_behaviors::BackUp"
      minimum_speed: 0.15
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      minimum_speed: 0.15
    wait:
      plugin: "nav2_behaviors::Wait"

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    # Between the controller and behaviours (/cmd_vel_nav_raw) and the
    # vehicle (/cmd_vel_nav), see the launch file. Limits are MPPI's
    # above, in [x, y, theta].
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.8, 0.0, 2.5]
    min_velocity: [-0.3, 0.0, -2.5]
    max_accel: [1.0, 0.0, 3.0]
    max_decel: [-2.0, 0.0, -3.0]
    # Only noise: the VMS drives any slower non-zero velocity at its
    # minimum speed, above the VESC's Minimum ERPM. A wider band zeroed
    # MPPI's slow turning commands while passing their yaw rate, which
    # a car cannot turn without moving.
    deadband_velocity: [0.02, 0.0, 0.0]
    # How long the last input is held before ramping to zero. A planner
    # that stops publishing must not be held longer than the VMS's own
    # staleness timeout on 0x2B1 (300 ms, `RosVelocityCommand`).
    velocity_timeout: 0.25

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 0.0
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - velocity_smoother
      - bt_navigator
