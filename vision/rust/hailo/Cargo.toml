[package]
name = "hailo"
version = "0.1.0"
edition = "2021"

[features]
device = ["dep:bindgen"]

[dependencies]
detection = { path = "../detection" }
framing = { path = "../framing" }
segmentation = { path = "../segmentation" }
turbojpeg = { version = "1.5", default-features = false, features = ["cmake", "pkg-config"] }

[build-dependencies]
bindgen = { version = "0.70", optional = true }
